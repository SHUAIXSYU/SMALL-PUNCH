<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
  <title id="title">Small Punch Test: conceptual axisymmetric cross-section</title>
  <desc id="description">A thin circular disc is clamped between an upper die and a lower supporting die. A central spherical punch moves downward through the upper opening toward the unsupported disc over the lower opening. An axial load cell measures the punch force. Initial contact is shown. Dimensions and geometry are illustrative, not verified project inputs.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="42" y="49" font-size="27" font-weight="700">Small Punch Test</text>
    <text x="42" y="80" font-size="17" fill="#475569">Conceptual axisymmetric cross-section</text>

    <!-- Centreline is behind the solid parts; no FE mesh is depicted. -->
    <path d="M 560 101 V 553" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="9 6"/>

    <!-- A load cell lies in the axial load path above the punch. -->
    <rect x="515" y="125" width="90" height="42" rx="4" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <path d="M 530 146 H 540 L 547 135 L 558 157 L 569 135 L 580 157 L 587 146 H 594" fill="none" stroke="#475569" stroke-width="1.7"/>
    <path d="M 524 167 H 596 V 257.07 A 76 76 0 1 1 524 257.07 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="2.3"/>

    <!-- Upper die has a wider access opening than the lower support opening. -->
    <path d="M 310 310 H 446 V 400 H 310 Z M 674 310 H 810 V 400 H 674 Z" fill="#d8dee8" stroke="#475569" stroke-width="2"/>

    <!-- Flat disc at initial contact. The upper and lower die faces clamp its rim. -->
    <rect x="300" y="400" width="520" height="14" fill="#f4c56a" stroke="#854d0e" stroke-width="2"/>

    <!-- Rounded inner lips support the disc while leaving a central opening. -->
    <path d="M 310 414 H 463 Q 475 414 475 426 V 500 H 310 Z M 657 414 H 810 V 500 H 645 V 426 Q 645 414 657 414 Z" fill="#d8dee8" stroke="#475569" stroke-width="2"/>

    <!-- Downward displacement and upward force reaction at the load path. -->
    <path d="M 687 212 V 285" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="712" y="229" font-size="19" font-weight="700">Punch displacement u</text>
    <text x="712" y="255" font-size="16" fill="#475569">Applied downward</text>
    <path d="M 626 166 V 108" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <text x="651" y="123" font-size="19" font-weight="700">Measured force F</text>
    <text x="651" y="148" font-size="16" fill="#475569">Axial load cell</text>
    <path d="M 644 145 H 606" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- Part labels use distinct horizontal leader lines. -->
    <g font-size="19">
      <text x="48" y="272">Spherical punch</text>
      <text x="48" y="349">Upper clamping die</text>
      <text x="48" y="402">Thin circular disc</text>
      <text x="48" y="426" font-size="16" fill="#475569">Specimen</text>
      <text x="48" y="465">Lower supporting die</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M 221 267 H 466 L 495 285"/>
      <path d="M 252 343 H 310"/>
      <path d="M 222 405 H 300"/>
      <path d="M 265 459 H 310"/>
      <path d="M 725 541 H 622 L 606 476"/>
    </g>
    <text x="736" y="547" font-size="18">Central die opening</text>

    <text x="489" y="579" font-size="16" fill="#475569">Axis of symmetry</text>
    <text x="42" y="630" font-size="15" fill="#475569">Initial contact shown. Schematic only; not to scale. Geometry and sensor arrangement are not verified project inputs.</text>
  </g>
</svg>
